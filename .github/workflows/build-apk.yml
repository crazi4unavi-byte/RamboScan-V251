name: Build RAMBO Scan V2.5.1 Verified APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify correct phone-brain source
        shell: bash
        run: |
          set -euo pipefail
          echo "Verifying V2.5.1 source tree..."
          test -f app/src/main/java/com/ramboscan/app/AnswerCache.kt
          test -f app/src/main/java/com/ramboscan/app/FinanceCalculator.kt
          test -f app/src/main/java/com/ramboscan/app/KnowledgeStore.kt
          test -f app/src/main/java/com/ramboscan/app/MainActivity.kt
          test -f app/src/main/java/com/ramboscan/app/OnDeviceRamboEngine.kt
          test -f app/src/main/java/com/ramboscan/app/OnlineFallbackEngine.kt
          test -f app/src/main/java/com/ramboscan/app/ScannerActivity.kt
          test -f app/src/main/java/com/ramboscan/app/StableTextGate.kt
          test ! -f app/src/main/java/com/ramboscan/app/RamboApiClient.kt
          grep -q 'versionName = "0.2.5.1"' app/build.gradle.kts
          test "$(find app/src/main/assets -maxdepth 1 -name 'knowledge_*.tsv' | wc -l)" -eq 6
          if grep -RInE 'RAMBO_API_BASE_URL|10\.0\.2\.2|Could not reach RAMBO|backend connection' app; then
            echo "ERROR: stale backend code detected"
            exit 1
          fi
          echo "PHONE-BRAIN SOURCE VERIFICATION: PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify local knowledge retrieval
        run: python3 tests/knowledge_search_selftest.py

      - name: Public fallback API smoke check
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 15 \
            "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=internal%20rate%20of%20return&format=json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "query" in d; print("Wikipedia API: PASS")'
          curl --fail --silent --show-error --retry 2 --max-time 15 \
            "https://api.stackexchange.com/2.3/info?site=engineering" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "items" in d; print("Stack Exchange API: PASS")'

      - name: Build and test debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload RAMBO Scan V2.5.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: RamboScan-V2.5.1-VERIFIED-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
